<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>外星人入侵</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,sans-serif;}
  canvas{display:block;background:#0b1020;touch-action:none;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:rgba(0,0,0,.55);}
  #overlay h1{margin:0 0 8px;font-size:8vmin;}
  #overlay p{margin:4px;font-size:4vmin;color:#cfd8ff;}
  #love{margin-top:10px;font-size:4.5vmin;color:#ffd9e6;font-style:italic;max-width:86%;line-height:1.5;}
  #love:empty{display:none;}
  #overlay button{margin-top:16px;padding:14px 34px;font-size:5vmin;border:0;border-radius:10px;background:#2ecc71;color:#0b1020;cursor:pointer;font-weight:bold;}
  #touch{position:fixed;bottom:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 20px;pointer-events:none;}
  .btn{width:72px;height:72px;border-radius:50%;border:2px solid #556;background:rgba(255,255,255,.08);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;}
  @media (pointer:coarse){#touch{display:flex;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <h1>👾 外星人入侵</h1>
  <p id="msg">方向键移动 · 空格射击</p>
  <p id="love"></p>
  <button id="start">开始游戏</button>
</div>
<div id="touch">
  <div class="btn" id="btnL">◀</div>
  <div class="btn" id="btnR">▶</div>
  <div class="btn" id="btnF">🔥</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S=1;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;S=Math.min(W/1200,H/800);}
resize();addEventListener('resize',resize);

// ---- 音效 (Web Audio, 程序生成) ----
let ac;
function tone(freq,dur,vol=.5){
  if(!ac)ac=new (AudioContext||webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
}
const sfx={fire:()=>tone(880,.08),explode:()=>tone(140,.25),hit:()=>tone(90,.4)};
const shipImg=new Image();shipImg.src='images/77.png';

// ---- 游戏状态 ----
const CFG={shipSpeed:5,bulletSpeed:25,alienSpeed:1,drop:10,aliensPerRow:11,rows:3,
  points:50,speedup:1.2,scoreScale:1.5,shipLimit:3};
// ---- 情话池 ----
const LOVE=[
  '你是我打过最舍不得通关的游戏。',
  '我的飞船再快，也逃不出你的引力。',
  '别急着清屏，先让我多陪你一会儿。',
  '输给你，是我最心甘情愿的事。',
  '你是我的满血复活，也是我的最高分。',
  '这局打完了，想你的心还在加载中。',
  '我的护盾只挡子弹，挡不住你。',
  '再难的一关，想到你就有了力气。',
  '你一来，我的生命值就满了。',
  '我不是不会赢，只是舍不得让你输。',
  '游戏可以重开，喜欢你这局我押上一生。',
  '你是我的存档点，累了就靠一靠。',
  '外星人再多，也比不上你闯进我心里的速度。',
  '分数会清零，喜欢你这件事只会一直累计。',
  '我愿意把最后一颗子弹，换成给你的拥抱。',
  '你是我代码里藏着的彩蛋。',
  '这一局结束了，下一局还要和你一起。',
  '别担心，我永远给你留一条命。',
  '你笑起来，比我通关还让我开心。',
  '我的雷达锁定的不是敌人，是你。',
  '世界很大，可我只想待在有你的坐标里。',
  '就算游戏结束，你也是我最想再来的那局。',
  '你是我生命里最不想躲开的那个。',
  '和你一起打的外星人，都显得可爱了。'
];
let ship,bullets,aliens,dir=1,score,level,lives,best=+localStorage.getItem('ai_best')||0;
let running=false,gameOver=false,cool=0;

function reset(){
  ship={x:W/2,y:H-60,w:56,h:40};
  bullets=[];aliens=[];dir=1;score=0;level=1;lives=CFG.shipLimit;cool=0;
  for(let r=0;r<CFG.rows;r++)for(let c=0;c<CFG.aliensPerRow;c++)
    aliens.push({x:40+c*62,y:50+r*52,w:40,h:34});
  gameOver=false;
}
reset();

// ---- 输入 ----
const keys={};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();fire();}
  else keys[e.code]=1;
});
addEventListener('keyup',e=>keys[e.code]=0);
function bind(id,fn){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn();});}
bind('btnL',()=>keys['ArrowLeft']=1);bind('btnR',()=>keys['ArrowRight']=1);
['btnL','btnR'].forEach(i=>document.getElementById(i).addEventListener('touchend',()=>{keys['ArrowLeft']=0;keys['ArrowRight']=0;}));
bind('btnF',()=>fire());

// ---- 逻辑 ----
function fire(){if(cool<=0&&running){bullets.push({x:ship.x,y:ship.y-24,w:4,h:16});sfx.fire();cool=8;}}

function step(){
  if(keys['ArrowLeft'])ship.x-=CFG.shipSpeed;if(keys['ArrowRight'])ship.x+=CFG.shipSpeed;
  if(keys['ArrowUp'])ship.y-=CFG.shipSpeed;if(keys['ArrowDown'])ship.y+=CFG.shipSpeed;
  ship.x=Math.max(30,Math.min(W-30,ship.x));ship.y=Math.max(30,Math.min(H-30,ship.y));
  if(cool>0)cool--;
  bullets.forEach(b=>b.y-=CFG.bulletSpeed);bullets=bullets.filter(b=>b.y>-20);
  // 外星人移动
  let edge=false;
  aliens.forEach(a=>{a.x+=CFG.alienSpeed*dir;if(a.x<=4||a.x+a.w>=W-4)edge=true;});
  if(edge){dir*=-1;aliens.forEach(a=>a.y+=CFG.drop);}
  // 子弹击中
  for(let i=aliens.length-1;i>=0;i--){const a=aliens[i];
    for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];
      if(b.x<a.x+a.w&&b.x+b.w>a.x&&b.y<a.y+a.h&&b.y+b.h>a.y){
        aliens.splice(i,1);bullets.splice(j,1);score+=Math.round(CFG.points*Math.pow(CFG.scoreScale,level-1));
        sfx.explode();break;}}}
  if(!aliens.length){endGame(true);return;}
  // 飞船被撞 / 到底
  let hit=false;
  for(const a of aliens){if(a.y+a.h>=H)hit=true;
    if(a.x<ship.x+ship.w&&a.x+a.w>ship.x&&a.y<ship.y+ship.h&&a.y+a.h>ship.y)hit=true;}
  if(hit)shipHit();
}
function shipHit(){
  lives--;sfx.hit();
  if(lives<=0)endGame(false);
  else{ship.x=W/2;ship.y=H-60;bullets=[];}
}
function endGame(win){
  gameOver=true;running=false;
  if(score>best){best=score;localStorage.setItem('ai_best',best);}
  document.getElementById('msg').textContent=(win?'🎉 胜利！':'💫 游戏结束！')+' 得分 '+score;
  document.getElementById('love').textContent=LOVE[Math.floor(Math.random()*LOVE.length)];
  document.getElementById('start').textContent='再来一局';
  document.getElementById('overlay').style.display='flex';
}

// ---- 绘制 ----
function draw(){
  ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H);
  // 飞船 (图片)
  if(shipImg.complete&&shipImg.naturalWidth>0){
    const s=Math.min(ship.w/shipImg.naturalWidth,ship.h/shipImg.naturalHeight);
    const dw=shipImg.naturalWidth*s,dh=shipImg.naturalHeight*s;
    ctx.drawImage(shipImg,ship.x-dw/2,ship.y-dh/2,dw,dh);
  }
  ctx.fillStyle='#ff6b6b'; // 外星人
  aliens.forEach(a=>{ctx.beginPath();ctx.arc(a.x+a.w/2,a.y+a.h/2,a.w/2,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(a.x+a.w/2-3,a.y+a.h/2-3,6,6);ctx.fillStyle='#ff6b6b';});
  ctx.fillStyle='#ffe66d'; // 子弹
  bullets.forEach(b=>ctx.fillRect(b.x-b.w/2,b.y,b.w,b.h));
  ctx.fillStyle='#fff';ctx.font=(16*S)+'px system-ui';
  ctx.fillText('得分 '+score,20,24);ctx.fillText('等级 '+level,20,44);
  ctx.fillText('生命 '+lives,W-80,24);ctx.fillText('最高 '+best,W-80,44);
}

// ---- 主循环 ----
function loop(){if(running)step();draw();requestAnimationFrame(loop);}
document.getElementById('start').addEventListener('click',()=>{
  ac&&ac.resume&&ac.resume();
  reset();running=true;document.getElementById('overlay').style.display='none';});
loop();
</script>
</body>
</html>
